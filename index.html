<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Рыбалка</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="game">
    <div id="hud">
      <div class="hud-item">🏆 <span id="score">0</span></div>
      <div class="hud-item">🎣 Удочка: <span id="rod-level">1</span></div>
      <div class="hud-item">💰 <span id="coins">0</span></div>
    </div>

    <div id="water-area">
      <div id="sky"></div>
      <div id="water">
        <div id="fish-container"></div>
        <div id="hook-area">
          <div id="line"></div>
          <div id="hook">🪝</div>
        </div>
      </div>
    </div>

    <div id="controls">
      <button id="cast-btn" class="big-btn">Забросить удочку</button>
    </div>

    <div id="catch-popup" class="hidden">
      <div class="popup-content">
        <h2 id="catch-title">Поймал!</h2>
        <div id="catch-icon" class="catch-icon"></div>
        <p id="catch-info"></p>
        <button id="catch-close" class="big-btn">Продолжить</button>
      </div>
    </div>

    <div id="shop-popup" class="hidden">
      <div class="popup-content">
        <h2>🎣 Магазин</h2>
        <div class="shop-item">
          <span>⬆️ Улучшить удочку (уровень <span id="shop-rod-level">1</span>)</span>
          <button id="upgrade-btn" class="buy-btn">Купить</button>
        </div>
        <button id="shop-close" class="big-btn">Закрыть</button>
      </div>
    </div>

    <button id="shop-btn-float" class="float-btn">🛒</button>
  </div>
  <script src="script.js"></script>
</body>
</html>
